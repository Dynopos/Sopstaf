<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="DYNO SOP Staf">
  <defs>
    <linearGradient id="chrome" x1=".15" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".22" stop-color="#ccd6d1"/>
      <stop offset=".45" stop-color="#87968f"/>
      <stop offset=".62" stop-color="#f6f9f7"/>
      <stop offset=".82" stop-color="#93a29b"/>
      <stop offset="1" stop-color="#5c6b65"/>
    </linearGradient>
    <radialGradient id="field" cx=".4" cy=".3" r=".85">
      <stop offset="0" stop-color="#20773f"/>
      <stop offset="1" stop-color="#0a3c1e"/>
    </radialGradient>
    <linearGradient id="hide" x1=".25" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#e8efeb"/>
      <stop offset="1" stop-color="#a3b3aa"/>
    </linearGradient>
    <linearGradient id="hideDark" x1=".25" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#b6c4bd"/>
      <stop offset="1" stop-color="#7d8c85"/>
    </linearGradient>
  </defs>

  <circle cx="256" cy="256" r="250" fill="url(#chrome)"/>
  <circle cx="256" cy="256" r="209" fill="#123522"/>
  <circle cx="256" cy="256" r="203" fill="url(#field)"/>

  <g stroke="#0a2c17" stroke-width="6.5" stroke-linejoin="round" stroke-linecap="round">

    <!-- spiked dorsal ridge, head -> tail (bases tucked behind the body) -->
    <g fill="#eef3f0">
      <path d="M342 166 L352 144 L326 184 Z"/>
      <path d="M324 187 L332 164 L308 205 Z"/>
      <path d="M306 208 L312 184 L288 222 Z"/>
      <path d="M286 224 L290 200 L266 236 Z"/>
      <path d="M264 238 L266 214 L242 250 Z"/>
      <path d="M240 251 L240 228 L216 263 Z"/>
      <path d="M214 264 L212 242 L190 274 Z"/>
      <path d="M188 275 L184 254 L164 281 Z"/>
      <path d="M162 282 L156 262 L138 284 Z"/>
      <path d="M136 285 L130 267 L112 286 Z"/>
      <path d="M110 286 L104 270 L 86 287 Z"/>
      <path d="M 84 287 L 78 273 L 62 286 Z"/>
    </g>

    <!-- far hind leg, drawn behind the torso -->
    <path d="M206 312 Q232 328 240 360 Q245 384 238 400
             Q256 408 272 412 Q282 416 270 419 L232 419
             Q220 417 222 406 Q219 378 207 358 Q196 338 194 318 Z"
          fill="url(#hideDark)"/>

    <!-- tail + torso + neck + head -->
    <path d="M436 196
             Q412 160 372 152 Q346 148 334 170
             Q322 196 302 212 Q280 226 258 240
             Q232 254 208 266 Q186 276 166 281
             Q112 291 54 286 Q34 283 40 299
             Q98 318 160 316 Q196 311 214 326
             Q244 350 282 340 Q312 330 322 298
             Q330 270 338 246 Q362 236 404 224
             Q428 216 436 196 Z"
          fill="url(#hide)"/>

    <!-- near hind leg -->
    <path d="M252 322 Q280 338 288 370 Q294 394 286 410
             Q304 418 320 422 Q330 426 318 429 L279 429
             Q267 427 269 416 Q266 388 254 368 Q242 348 240 328 Z"
          fill="url(#hide)"/>

    <!-- arm -->
    <path d="M318 280 Q340 286 353 303 Q358 313 348 311 Q336 297 315 293 Z"
          fill="url(#hide)"/>

    <!-- open jaw: dark mouth wedge with teeth -->
    <path d="M354 196 Q392 194 430 186 Q422 206 392 212 Q366 214 352 204 Z"
          fill="#0a2c17" stroke="none"/>
    <path d="M360 196 L365 205 L370 195 Z M376 194 L381 204 L386 193 Z
             M392 192 L397 202 L402 191 Z M408 190 L413 199 L418 188 Z"
          fill="#ffffff" stroke="none"/>
  </g>

  <circle cx="358" cy="176" r="8.5" fill="#0a2c17"/>
  <circle cx="360.5" cy="173" r="2.8" fill="#7fe0a2"/>
</svg>
